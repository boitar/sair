name: SAIR - Siri-ously AI Router
description: 国行 Apple 智能大模型重写模块：通过 Egern 模块与脚本重写将 Apple 智能请求转接至自定义大模型服务。
author: boitar
homepage: https://github.com/boitar/sair

mitm:
  hostnames:
    - prod-yabuli.qianwen.com

scriptings:
  - name: SAIR Inspector Request
    match: ^https:\/\/prod-yabuli\.qianwen\.com\/sair\/(status|config|models|reset)(?:[/?].*)?$
    type: request
    require_body: false
    timeout: 15
    script_url: https://raw.githubusercontent.com/boitar/sair/main/scripts/sair_adapter.js
    arguments:
      endpoint: https://api.openai.com/v1/chat/completions
      api_key: ""
      model: gpt-4o-mini
      notify: error
      fallback: true
      timeout_siri: 7
      timeout_writing: 15
      timeout_vision: 10

  - name: SAIR Inspector Response
    match: ^https:\/\/prod-yabuli\.qianwen\.com\/sair\/(status|config|models|reset)(?:[/?].*)?$
    type: response
    require_body: false
    timeout: 15
    script_url: https://raw.githubusercontent.com/boitar/sair/main/scripts/sair_adapter.js
    arguments:
      endpoint: https://api.openai.com/v1/chat/completions
      api_key: ""
      model: gpt-4o-mini
      notify: error
      fallback: true
      timeout_siri: 7
      timeout_writing: 15
      timeout_vision: 10

  - name: SAIR Request
    match: ^https:\/\/prod-yabuli\.qianwen\.com\/.*
    type: request
    require_body: true
    timeout: 60
    script_url: https://raw.githubusercontent.com/boitar/sair/main/scripts/sair_adapter.js
    arguments:
      endpoint: https://api.openai.com/v1/chat/completions
      api_key: ""
      model: gpt-4o-mini
      notify: error
      fallback: true
      timeout_siri: 7
      timeout_writing: 15
      timeout_vision: 10

  - name: SAIR Response
    match: ^https:\/\/prod-yabuli\.qianwen\.com\/.*
    type: response
    require_body: true
    timeout: 60
    script_url: https://raw.githubusercontent.com/boitar/sair/main/scripts/sair_adapter.js
    arguments:
      endpoint: https://api.openai.com/v1/chat/completions
      api_key: ""
      model: gpt-4o-mini
      notify: error
      fallback: true
      timeout_siri: 7
      timeout_writing: 15
      timeout_vision: 10
